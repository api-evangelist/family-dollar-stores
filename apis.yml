description: >-
  Family Dollar is a chain of discount variety stores in the United States offering a broad
  assortment of merchandise in the $1 to $10 range, including consumables, household and home
  products, apparel, seasonal goods and electronics. Stores are concentrated in neighborhood
  locations and in food deserts where other retailers do not operate. Dollar Tree, Inc.
  divested the Family Dollar business on 7 July 2025 to Brigade Capital Management and
  Macellum Capital Management; Family Dollar now operates as a standalone private retailer
  headquartered in Chesapeake, Virginia, and also runs the Chesapeake Media Group retail media
  network. Family Dollar publishes no public API, developer portal, SDK, webhook catalog or
  agent surface: contract discovery on 2026-09-07 probed every well-known and specification
  path across www.familydollar.com, corporate.familydollar.com and careers.familydollar.com
  and returned no machine-readable contract of any kind.
